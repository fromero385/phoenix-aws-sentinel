[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-aws-sentinel"
version = "0.1.0"
description = "Local-first, read-only architectural cloud leak and zombie asset detector for AWS."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "PHOENIX Open Source Community" }
]
keywords = ["aws", "cloud-cost", "finops", "devops", "nat-gateway", "ebs", "terraform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking"
]
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.26.0"]

[project.scripts]
aws-sentinel = "sentinel:main"

